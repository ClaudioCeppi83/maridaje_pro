<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
    :root {
        --wine-color: #9e1b32; /* Un rojo más intenso */
        --glass-color: #ffffff;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        /* FONDO DE PRUEBA: Cuadros para demostrar transparencia */
        background-color: #222;
        background-image: 
            linear-gradient(45deg, #333 25%, transparent 25%), 
            linear-gradient(-45deg, #333 25%, transparent 25%), 
            linear-gradient(45deg, transparent 75%, #333 75%), 
            linear-gradient(-45deg, transparent 75%, #333 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .loader-copa {
        position: relative;
        width: 50px;
        height: 120px;
    }

    /* --- EL CUENCO (La Máscara) --- */
    .copa-bowl {
        width: 50px;
        height: 60px;
        border: 3px solid var(--glass-color);
        border-top: none;
        border-radius: 0 0 25px 25px;
        position: relative;
        overflow: hidden; /* Esto recorta el cuadrado gigante */
        
        /* Brillo del cristal (Opcional, pero queda bonito) */
        box-shadow: inset -5px 0 10px rgba(255,255,255,0.1);
    }

    /* --- EL VINO (El Truco del Cuadrado Giratorio) --- */
    .vino {
        position: absolute;
        /* Hacemos el cuadrado MUCHO más grande que la copa */
        width: 150px; 
        height: 150px;
        background-color: var(--wine-color);
        
        /* Esta forma crea las "olas" al girar */
        border-radius: 40%; 
        
        /* Posición inicial (abajo y centrado) */
        left: 50%;
        top: 100%; 
        
        /* Aplicamos dos animaciones juntas: girar y subir */
        animation: llenar-y-girar 4s infinite linear;
        
        /* Centramos el punto de rotación */
        transform-origin: center center;
    }

    /* --- TALLO Y BASE --- */
    .loader-copa::before {
        content: '';
        position: absolute;
        top: 63px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 35px;
        background-color: var(--glass-color);
        box-shadow: 0 0 5px rgba(0,0,0,0.5); /* Sombra para resaltar sobre cualquier fondo */
    }

    .loader-copa::after {
        content: '';
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 4px;
        border-radius: 4px;
        background-color: var(--glass-color);
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* --- ANIMACIÓN UNIFICADA --- */
    @keyframes llenar-y-girar {
        0% {
            top: 100%; /* Empieza debajo de la copa (vacío) */
            transform: translateX(-50%) rotate(0deg);
        }
        40% {
            top: 15%; /* Sube hasta llenarse */
        }
        60% {
            top: 15%; /* Se mantiene lleno un momento */
        }
        100% {
            top: 100%; /* Baja (se vacía) y completa el giro */
            transform: translateX(-50%) rotate(360deg);
        }
    }

</style>
</head>
<body>

    <div class="loader-copa">
        <div class="copa-bowl">
            <div class="vino"></div>
        </div>
    </div>

</body>
</html>
